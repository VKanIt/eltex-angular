<h1>{{ blog().title }}</h1>
<div class="subtitle mb-3">
    <time [dateTime]="blog().date.getFullYear() + '-' + blog().date.getMonth() + '-' + blog().date.getDate()">
        {{ blog().date.toLocaleString('ru', {year: "numeric", month: "long", day: "numeric"}) }}
    </time>
    <app-input-rating
        [initRating]="blog().rating"
        [isDisabled]="isDisabled()"
        (edit)="editRating($event)"
    />
</div>
<div class="blog-img mb-3">
    <img
        [src]="blog().image ?? './assets/images/blogs/image_blog.png'"
        [alt]="blog().title"
    >
</div>
<p class="mb-3">
    {{ blog().text }}
</p>
<div 
    class="comments-title"
>
    <h2>Комментарии</h2>
    <button
        [hidden]="client().id === null"
        class="btn"
        (click)="addComment()"
    >
        Оставить комментарий
    </button>
</div>
<div class="comments m-wrap">
    @for (item of comments(); track $index) {
        <div class="comments__layout">
            <app-card-comment

                [comment]="item"
            />
        </div>
    }  @empty {
        <div
            class="for-empty"
        >
            Нет комментариев
        </div>
    }
</div>
<div
    class="content-center"
    [hidden]="countComments() <= limitActiveComments()"
>
    <button 
        class="btn btn-outline"
        (click)="getMore()"
    >
        Показать еще
    </button>    
</div>
